<title>Счётчик дней</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: одна колонка — большой счётчик дней, полоса до следующей вехи, месячный календарь серии */
:root {
  --bg: #eef2f4;
  --surface: #ffffff;
  --ink: #15232b;
  --muted: #5d6f78;
  --line: #d3dde2;
  --clean: #1f8a6b;
  --clean-soft: #cfeadf;
  --clean-ink: #ffffff;
  --slip: #c2413b;
  --slip-soft: #f6d9d6;
  --accent: #2a5d7c;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171c; --surface: #172229; --ink: #e4ecef; --muted: #8fa2ab; --line: #2a3a43;
    --clean: #3cbf94; --clean-soft: #1b3d33; --clean-ink: #08130f;
    --slip: #ef7a72; --slip-soft: #42221f; --accent: #7fb6d6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171c; --surface: #172229; --ink: #e4ecef; --muted: #8fa2ab; --line: #2a3a43;
  --clean: #3cbf94; --clean-soft: #1b3d33; --clean-ink: #08130f;
  --slip: #ef7a72; --slip-soft: #42221f; --accent: #7fb6d6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 22px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1, h2 { margin: 0; text-wrap: balance; }

.habit { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.habit label { color: var(--muted); }
#habit {
  flex: 1 1 180px; min-width: 0; font: inherit; color: var(--ink); background: transparent;
  border: 0; border-bottom: 1px dashed var(--line); padding: 2px 0;
}
#habit:focus { outline: none; border-bottom-color: var(--accent); }

.hero { display: grid; gap: 6px; }
.big {
  font-family: var(--f-display); font-weight: 700; line-height: .95;
  font-size: clamp(76px, 24vw, 132px); letter-spacing: -.03em;
  font-variant-numeric: tabular-nums; color: var(--clean);
}
.big.waiting { color: var(--accent); }
.big-unit { font-family: var(--f-display); font-weight: 500; font-size: 20px; }
.clock { font-family: var(--f-mono); color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

.mile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
.mile-row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.mile-row b { font-weight: 600; }
.bar { height: 8px; background: var(--clean-soft); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--clean); border-radius: 4px; transition: width .6s ease; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-family: var(--f-mono); font-size: 12px; padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--muted);
}
.chip.done { background: var(--clean); border-color: var(--clean); color: var(--clean-ink); }

.cal { display: grid; gap: 10px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-head h2 { font-family: var(--f-display); font-weight: 500; font-size: 18px; }
.nav { display: flex; gap: 6px; }
button {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 12px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button:focus-visible, #habit:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.dow { text-align: center; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding-bottom: 2px; }
.d {
  aspect-ratio: 1; max-width: 100%; border-radius: 8px; display: grid; place-items: center; position: relative;
  font-family: var(--f-mono); font-size: 14px; font-variant-numeric: tabular-nums; color: var(--muted);
}
.d.empty { visibility: hidden; }
.d.clean { background: var(--clean); color: var(--clean-ink); font-weight: 500; }
.d.old { background: var(--clean-soft); color: var(--ink); }
.d.slip { background: var(--slip-soft); color: var(--slip); font-weight: 500; }
.d.ahead { color: var(--ink); }
.d.start { box-shadow: inset 0 0 0 2px var(--accent); color: var(--ink); }
.d.clean.start { box-shadow: inset 0 0 0 2px var(--clean-ink); }
.d.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.d.mile-day::after {
  content: attr(data-m); position: absolute; top: 2px; right: 4px; font-size: 9px; line-height: 1;
  opacity: .85;
}
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.stat b { display: block; font-family: var(--f-display); font-weight: 500; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }

.reset { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 18px; }
.reset p { margin: 0; color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.danger { color: var(--slip); border-color: var(--slip-soft); }
.danger.solid { background: var(--slip); color: var(--surface); border-color: var(--slip); }
.quiet { color: var(--muted); font-size: 12px; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<div class="wrap">
  <div class="habit">
    <label for="habit">Бросаю:</label>
    <input id="habit" type="text" maxlength="60" placeholder="напишите что (необязательно)" autocomplete="off">
  </div>

  <section class="hero" aria-live="polite">
    <div class="eyebrow" id="heroLabel">Без срывов</div>
    <div><span class="big" id="big">0</span> <span class="big-unit" id="bigUnit">дней</span></div>
    <div class="clock" id="clock"></div>
  </section>

  <section class="mile">
    <div class="mile-row"><span id="mileText">Следующая веха</span><b id="mileLeft"></b></div>
    <div class="bar" role="progressbar" aria-label="Прогресс до следующей вехи" id="barWrap"><i id="bar"></i></div>
    <div class="chips" id="chips"></div>
  </section>

  <section class="cal">
    <div class="cal-head">
      <h2 id="monthName"></h2>
      <div class="nav">
        <button id="prev" type="button" aria-label="Предыдущий месяц">←</button>
        <button id="todayBtn" type="button">Сегодня</button>
        <button id="next" type="button" aria-label="Следующий месяц">→</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i class="sw" style="background:var(--clean)"></i>чистый день</span>
      <span><i class="sw" style="background:var(--clean-soft)"></i>прошлая серия</span>
      <span><i class="sw" style="background:var(--slip-soft)"></i>срыв</span>
      <span><i class="sw" style="box-shadow:inset 0 0 0 2px var(--accent)"></i>старт</span>
    </div>
  </section>

  <section class="stats">
    <div class="stat"><b id="sStart"></b><span>дата старта</span></div>
    <div class="stat"><b id="sBest"></b><span>лучшая серия, дней</span></div>
    <div class="stat"><b id="sTries"></b><span>попытка</span></div>
  </section>

  <section class="reset">
    <p>Сорвались — не страшно. Отметьте срыв: серия начнётся заново со следующего дня, а прошлая останется в календаре.</p>
    <div class="row" id="resetRow">
      <button id="slipBtn" type="button" class="danger">Отметить срыв сегодня</button>
    </div>
    <div class="row" id="confirmRow" hidden>
      <button id="slipYes" type="button" class="danger solid">Да, срыв сегодня</button>
      <button id="slipNo" type="button">Отмена</button>
    </div>
    <p class="quiet">Данные хранятся только в этом браузере.</p>
  </section>
</div>

<script>
(function () {
  var DEFAULT_START = "2026-10-15";
  var KEY = "quit-counter-v1";
  var MILES = [1, 3, 7, 14, 21, 30, 60, 90, 100, 180, 365, 500, 730, 1000];
  var MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
  var MONTHS_GEN = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  var DOW = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];

  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.start) return s; } catch (e) {}
    return { start: DEFAULT_START, history: [], slips: [], habit: "" };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function parse(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function key(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function diffDays(a, b) { return Math.round((b - a) / 864e5); } // календарные дни между полуночами
  function midnight(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function plural(n, one, few, many) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }
  function human(d) { return d.getDate() + " " + MONTHS_GEN[d.getMonth()]; }

  var state = load();
  var view = midnight(new Date());
  if (view < parse(state.start)) view = parse(state.start);
  view = new Date(view.getFullYear(), view.getMonth(), 1);

  var $ = function (id) { return document.getElementById(id); };
  $("habit").value = state.habit || "";
  $("habit").addEventListener("input", function (e) { state.habit = e.target.value; save(); });

  // Текущая серия в днях: день старта — первый день. До старта — 0.
  function streak(today) {
    var s = parse(state.start);
    return today < s ? 0 : diffDays(s, today) + 1;
  }

  function renderHero() {
    var now = new Date(), today = midnight(now), s = parse(state.start);
    var n = streak(today);
    if (today < s) {
      var ms = s - now, h = Math.floor(ms / 36e5), m = Math.floor(ms % 36e5 / 6e4), sec = Math.floor(ms % 6e4 / 1e3);
      $("heroLabel").textContent = "Старт " + human(s) + (diffDays(today, s) === 1 ? ", завтра" : "");
      $("big").textContent = String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
      $("big").classList.add("waiting");
      $("bigUnit").textContent = "до старта";
      $("clock").textContent = "Осталось " + h + " ч " + m + " мин " + sec + " с. Сегодня последний день — дальше счёт пойдёт сам.";
    } else {
      var ms2 = now - s, d = Math.floor(ms2 / 864e5), hh = Math.floor(ms2 % 864e5 / 36e5), mm = Math.floor(ms2 % 36e5 / 6e4);
      $("heroLabel").textContent = "Без срывов · день " + n;
      $("big").textContent = n;
      $("big").classList.remove("waiting");
      $("bigUnit").textContent = plural(n, "день", "дня", "дней");
      $("clock").textContent = "С " + human(s) + ": " + d + " " + plural(d, "сутки", "суток", "суток") + " " + hh + " ч " + mm + " мин";
    }
  }

  function renderMiles() {
    var n = streak(midnight(new Date()));
    var next = MILES.find(function (m) { return m > n; }) || (Math.ceil((n + 1) / 365) * 365);
    var prevIdx = MILES.filter(function (m) { return m <= n; });
    var prev = prevIdx.length ? prevIdx[prevIdx.length - 1] : 0;
    var left = next - n;
    var nextDate = addDays(parse(state.start), next - 1);
    $("mileText").textContent = "Следующая веха: " + next + " " + plural(next, "день", "дня", "дней") + " (" + human(nextDate) + ")";
    $("mileLeft").textContent = "ещё " + left + " " + plural(left, "день", "дня", "дней");
    var pct = Math.max(0, Math.min(100, (n - prev) / (next - prev) * 100));
    $("bar").style.width = pct + "%";
    $("barWrap").setAttribute("aria-valuenow", Math.round(pct));
    $("chips").innerHTML = MILES.slice(0, 11).map(function (m) {
      return '<span class="chip' + (n >= m ? " done" : "") + '">' + m + "</span>";
    }).join("");
  }

  function renderCal() {
    var today = midnight(new Date()), s = parse(state.start);
    var y = view.getFullYear(), mo = view.getMonth();
    $("monthName").textContent = MONTHS[mo] + " " + y;
    var slips = {}; state.slips.forEach(function (k) { slips[k] = 1; });
    var mileDays = {}; MILES.forEach(function (m) { mileDays[key(addDays(s, m - 1))] = m; });
    var html = DOW.map(function (d) { return '<div class="dow">' + d + "</div>"; }).join("");
    var first = new Date(y, mo, 1), lead = (first.getDay() + 6) % 7, days = new Date(y, mo + 1, 0).getDate();
    for (var i = 0; i < lead; i++) html += '<div class="d empty"></div>';
    for (var dn = 1; dn <= days; dn++) {
      var d = new Date(y, mo, dn), k = key(d), cls = ["d"], label = human(d);
      var inOld = state.history.some(function (h) { return d >= parse(h.start) && d <= parse(h.end); });
      if (slips[k]) { cls.push("slip"); label += ", срыв"; }
      else if (d >= s && d <= today) { cls.push("clean"); label += ", день " + (diffDays(s, d) + 1); }
      else if (inOld) { cls.push("old"); label += ", прошлая серия"; }
      else if (d > today) cls.push("ahead");
      if (k === state.start) { cls.push("start"); label += ", старт"; }
      if (d.getTime() === today.getTime()) { cls.push("today"); label += ", сегодня"; }
      var m = mileDays[k], extra = "";
      if (m && d >= s) { cls.push("mile-day"); extra = ' data-m="' + m + '"'; label += ", веха " + m; }
      html += '<div class="' + cls.join(" ") + '"' + extra + ' role="img" aria-label="' + label + '">' + dn + "</div>";
    }
    $("grid").innerHTML = html;
  }

  function renderStats() {
    var n = streak(midnight(new Date()));
    var best = state.history.reduce(function (b, h) { return Math.max(b, diffDays(parse(h.start), parse(h.end)) + 1); }, n);
    $("sStart").textContent = human(parse(state.start));
    $("sBest").textContent = best;
    $("sTries").textContent = "№ " + (state.history.length + 1);
    $("slipBtn").disabled = midnight(new Date()) < parse(state.start);
  }

  function renderAll() { renderHero(); renderMiles(); renderCal(); renderStats(); }

  $("prev").onclick = function () { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); renderCal(); };
  $("next").onclick = function () { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderCal(); };
  $("todayBtn").onclick = function () { var t = new Date(); view = new Date(t.getFullYear(), t.getMonth(), 1); renderCal(); };

  $("slipBtn").onclick = function () { $("resetRow").hidden = true; $("confirmRow").hidden = false; $("slipYes").focus(); };
  $("slipNo").onclick = function () { $("confirmRow").hidden = true; $("resetRow").hidden = false; };
  $("slipYes").onclick = function () {
    var today = midnight(new Date()), s = parse(state.start);
    if (today > s) state.history.push({ start: state.start, end: key(addDays(today, -1)) });
    if (state.slips.indexOf(key(today)) < 0) state.slips.push(key(today));
    state.start = key(addDays(today, 1));
    save();
    $("confirmRow").hidden = true; $("resetRow").hidden = false;
    renderAll();
  };

  var lastDay = key(new Date());
  setInterval(function () {
    renderHero();
    if (key(new Date()) !== lastDay) { lastDay = key(new Date()); renderAll(); }
  }, 1000);
  renderAll();
})();
</script>
