<style>
  /* оформление по шаблону презентации УКПФ: фон #E5DBC0, орнамент слева, логотип справа сверху, линия и малый логотип снизу */
  :root { --navy: #1F3864; --blue: #2E5395; --teal: #16A9B4; --ink: #2b2618; --line: rgba(60,50,30,.28); --muted: #5b5445; --bg: #E5DBC0; --strip: 52px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); }
  body { display: flex; flex-direction: column; padding-left: var(--strip); }
  #strip { position: fixed; left: 0; top: 0; bottom: 0; width: var(--strip); background: var(--bg) url("{{STRIP}}") repeat-y 0 0 / var(--strip) auto; z-index: 1; }
  nav { flex: 0 0 auto; display: flex; gap: 4px; align-items: flex-end; padding: 8px 14px 0 12px; background: transparent; border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav button { border: 1px solid transparent; border-bottom: none; background: none; padding: 10px 18px 11px; font-size: 15px; font-weight: 700; color: var(--muted); cursor: pointer; border-radius: 10px 10px 0 0; white-space: nowrap; }
  nav button:hover { color: var(--navy); background: rgba(255,255,255,.35); }
  nav button.on { color: var(--navy); background: rgba(255,255,255,.55); border-color: var(--line); position: relative; top: 1px; }
  nav .sp { flex: 1; }
  nav .brand { align-self: center; height: 54px; width: auto; margin: 0 0 6px 10px; flex: 0 0 auto; }
  main { flex: 1; min-height: 0; position: relative; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
  footer.app-ft { flex: 0 0 auto; display: flex; align-items: center; gap: 14px; min-height: 36px; padding: 3px 14px 3px 260px; border-top: 1px solid rgba(60,50,30,.35); }
  footer.app-ft .hint { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  footer.app-ft .sp { flex: 1; }
  footer.app-ft img { height: 26px; width: auto; display: block; flex: 0 0 auto; }
  iframe[hidden] { display: none; }
  #toast { position: fixed; right: 18px; bottom: 52px; z-index: 10; max-width: 460px; padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.45; color: #fff; background: var(--navy); box-shadow: 0 6px 24px rgba(0,0,0,.18); cursor: pointer; }
  #toast[hidden] { display: none; }
  /* неприметная кнопка настроек — левый нижний угол */
  #cfgBtn { position: fixed; left: calc(var(--strip) + max(10px, env(safe-area-inset-left, 0px))); bottom: max(5px, env(safe-area-inset-bottom, 0px)); z-index: 9; border: 1px solid var(--line); background: rgba(255,255,255,.6); color: var(--muted); font-size: 12px; padding: 4px 10px; border-radius: 7px; cursor: pointer; opacity: .75; }
  #cfgBtn:hover, #cfgBtn:focus-visible { opacity: 1; color: var(--navy); }
  #permBtn { position: fixed; left: calc(var(--strip) + 160px); bottom: max(5px, env(safe-area-inset-bottom, 0px)); z-index: 9; border: none; background: #b45309; color: #fff; font-size: 12.5px; font-weight: 700; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  #permBtn[hidden] { display: none; }
  #cfg { position: fixed; inset: 0; z-index: 20; background: rgba(15,23,42,.45); display: flex; align-items: flex-end; justify-content: flex-start; padding: 16px; }
  #cfg[hidden] { display: none; }
  .cfg-in { width: min(720px, 100%); max-height: calc(100% - 20px); overflow: auto; background: #fff; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.25); padding: 16px 18px; font-size: 13px; color: #1e293b; }
  .cfg-hd { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--navy); }
  .cfg-hd button { margin-left: auto; border: none; background: #f1f5f9; border-radius: 50%; width: 30px; height: 30px; font-size: 18px; cursor: pointer; }
  .cfg-note { color: var(--muted); margin: 6px 0 12px; line-height: 1.5; }
  .cfg-sec { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
  .cfg-row { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid #f1f5f9; flex-wrap: wrap; }
  .cfg-row .lbl { flex: 0 0 210px; font-weight: 600; }
  .cfg-row .val { flex: 1; min-width: 180px; color: #334155; line-height: 1.4; word-break: break-word; }
  .cfg-row .val small { display: block; color: var(--muted); }
  .cfg-row .val .auto { color: var(--muted); }
  .cfg-row .val .bad { color: #b91c1c; }
  .cfg-row button, .cfg-add button { border: 1px solid var(--line); background: #f8fafc; border-radius: 7px; padding: 5px 10px; font-size: 12px; cursor: pointer; color: var(--navy); font-weight: 600; }
  .cfg-row button.x { color: #b91c1c; }
  .cfg-add { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .cfg-hint { margin: 0 0 6px; padding: 8px 10px; border-radius: 8px; background: #fff7e6; color: #6b4a00; font-size: 12.5px; line-height: 1.5; }
  .cfg-rep { margin-top: 10px; font-size: 12.5px; }
  .cfg-rep summary { cursor: pointer; font-weight: 600; color: var(--navy); }
  .cfg-slides { margin-top: 4px; }
  .cfg-slides summary { font-weight: 400; color: var(--navy); cursor: pointer; }
  .cfg-slides small { display: block; padding: 2px 0; border-top: 1px dashed #e2e8f0; }
  .cfg-ft { position: sticky; bottom: -16px; display: flex; align-items: center; gap: 10px; margin: 16px -18px -16px; padding: 12px 18px 16px; border-top: 1px solid var(--line); background: #fff; }
  .cfg-ft span { color: var(--muted); font-size: 12px; flex: 1; }
  .cfg-main { border: none; background: var(--navy); color: #fff; border-radius: 8px; padding: 9px 18px; font-size: 13.5px; font-weight: 700; cursor: pointer; }
  .cfg-main:disabled { opacity: .6; cursor: default; }
  @media (max-width: 600px) { .cfg-row .lbl { flex: 1 1 100%; } }
  @media (max-width: 600px) { :root { --strip: 26px; } nav button { padding: 8px 10px 9px; font-size: 13px; } nav .brand { height: 30px; } footer.app-ft .hint { display: none; } }
</style>
</head>

  <iframe id="f-mb" data-src="mb.html" title="Мойка и МБ" hidden></iframe>

  </div>

<script>
// Оболочка: три дашборда во вкладках. Все на одном адресе, поэтому вкладка «Мойка и МБ»
// берёт фото/видео и баллы мойки из вкладки «Качество мойки» (window.MOIKA_API).
(function () {
  const TAB_KEY = 'appActiveTab';
  const isApp = location.protocol === 'app:';
  // веб-дашборд одним файлом: страницы вкладок лежат внутри файла (base64), данные — из «⚙ Настроек» браузера
  const isWeb = !isApp && !!window.__WEB_COMBINED;
  const live = isApp || isWeb;
  const started = (f) => !!(f.getAttribute('src') || f.hasAttribute('srcdoc'));
  function startFrame(f) {
    if (started(f)) return false;

    if (pg) {

    }
    return false;
  }
  const frame = (t) => document.getElementById('f-' + t);
  const TABS = ['moika', 'nok', 'mb', 'week', 'nc'];
  let current = 'moika';

  function show(t) {

    TABS.forEach((k) => { frame(k).hidden = k !== t; });

  }
  document.getElementById('tabs').addEventListener('click', (e) => { const b = e.target.closest('button[data-tab]'); if (b) show(b.dataset.tab); });
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && /^[1-5]$/.test(e.key)) { e.preventDefault(); show(TABS[+e.key - 1]); }
  });

  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function toast(text, kind) {

    toastEl.hidden = false;

    if (kind) toastTimer = setTimeout(() => { toastEl.hidden = true; }, kind === 'err' ? 20000 : 9000);
  }
  toastEl.addEventListener('click', () => { toastEl.hidden = true; });

  // Папка «Данные» приложения (туда скачивается SharePoint) → во все вкладки
  const loaded = (f) => new Promise((res) => {
    if (started(f) && f.contentDocument && f.contentDocument.readyState === 'complete' && f.contentWindow.APP_FS) return res(true);
    if (!started(f)) return res(false);
    f.addEventListener('load', () => setTimeout(() => res(true), 1500), { once: true });
    setTimeout(() => res(!!(f.contentWindow && f.contentWindow.APP_FS)), 30000);   // не ждать вечно
  });
  let attachBusy = null, attachAgain = null;   // запрос, пришедший во время работы, — выполнить после (с force и media)
  const applied = {};   // выбранные в «Настройках» файлы: что уже прочитано (путь|время|размер)
  // файл читает сама вкладка — тогда он «свой» для её библиотек
  const srcFileIn = (win, f) => win.APP_FS.readChosen(f);
  let mediaDone = false, ncDone = null;
  // force — перечитать всё; opts.media === false — фото/видео не пересканировать (проверка раз в 2 минуты)
  async function attachData(force, opts) {
    if (!live) return;
    opts = opts || {};
    if (attachBusy) {
      attachAgain = { force: !!(force || (attachAgain && attachAgain.force)), media: opts.media !== false || !!(attachAgain && attachAgain.media) };
      return attachBusy;
    }
    attachBusy = (async () => {
      const m = frame('moika');
      if (!(await loaded(m))) return;
      const w = m.contentWindow;
      if (!w.APP_FS) return;
      if (force) Object.keys(applied).forEach((k) => { delete applied[k]; });
      // каждой вкладке — только свои папки; файлы, выбранные в «Настройках», важнее автопоиска
      const roles = await w.APP_FS.roles();
      const chosen = await w.APP_FS.chosen();
      const all = roles.acts.concat(roles.media, roles.svod, roles.nc || []);
      document.getElementById('dataHint').textContent = all.length || Object.keys(chosen).length ? '📁 ' + all.concat(Object.values(chosen).map((f) => f.name)).join(' · ') : '';
      w.__APP_ACTS_SEPARATE = true;   // акты не ищем в папках с фото
      if (roles.media.length && (force || opts.media !== false || !mediaDone)) {
        mediaDone = true;
        const media = w.APP_FS.group(roles.media, 'Фото/видео');
        try { if (w.__useMediaHandle) await w.__useMediaHandle(media, false); } catch (e) { console.warn('moika media', e); }
        try { if (w.useIncubMediaHandle) await w.useIncubMediaHandle(media, false); } catch (e) { console.warn('moika incub', e); }
      }
      // акты: выбранные файлы — напрямую; остальные виды — автопоиском в папке актов
      const APPLY = { akt: 'applyAktBuffer', incub: 'applyIncubBuffer', zpp: 'applyZppBuffer', schedule: 'applyScheduleBuffer' };
      for (const k of Object.keys(APPLY)) {
        const f = chosen[k]; if (!f) continue;
        const sig = f.path + '|' + f.mtime + '|' + f.size;
        if (applied['m:' + k] === sig) continue;
        try {
          const file = await srcFileIn(w, f); await w[APPLY[k]](await file.arrayBuffer(), f.name); applied['m:' + k] = sig;
          if (k === 'akt' && w.__keepOnlyAkt) w.__keepOnlyAkt(f.name);   // акт выращивания — только выбранный
        }
        catch (e) { console.warn('moika', k, e); toast('Не удалось прочитать «' + f.name + '»: ' + e.message, 'err'); }
      }
      if (roles.acts.length && w.applyActsFromFolder) {
        try { await w.applyActsFromFolder(w.APP_FS.group(roles.acts, 'Акты'), null, { skip: Object.keys(chosen), force }); } catch (e) { console.warn('moika acts', e); }
      }
      // Мойка и МБ: выбранные Свод/акт — напрямую, остальное — из папок
      const mb = frame('mb');
      if (started(mb) && await loaded(mb)) {
        const x = mb.contentWindow;
        try {
          const dirs = (chosen.svod ? [] : roles.svod).concat(chosen.akt ? [] : roles.acts);
          if (x.__mbAttachDir) x.__mbAttachDir(dirs.length ? x.APP_FS.group(dirs, 'Свод и акты') : null, chosen.svod ? [] : roles.svod);
          for (const [k, fn] of [['svod', 'processMBFile'], ['akt', 'processAktFile']]) {
            const f = chosen[k]; if (!f) continue;
            const sig = f.path + '|' + f.mtime + '|' + f.size;
            if (applied['mb:' + k] === sig) continue;

      if (started(wk)) try { wk.contentWindow.postMessage('app:media', '*'); } catch (e) {}
      // «Несоответствие по площадкам» — свои папки (роль nc), читаются отдельно от «Качества мойки»
      const ncKey = (roles.nc || []).join('|');

        ncDone = ncKey;
        try { await w.MOIKA_API.nc.scan(roles.nc && roles.nc.length ? w.APP_FS.group(roles.nc, 'Несоответствие по площадкам') : null); } catch (e) { console.warn('nc', e); }
        const ncf = frame('nc');
        if (started(ncf)) try { ncf.contentWindow.postMessage('app:nc', '*'); } catch (e) {}
      }
      const nok = frame('nok');
      if (started(nok)) try { nok.contentWindow.__appDataChanged && nok.contentWindow.__appDataChanged(); } catch (e) {}
    })().finally(() => {
      attachBusy = null;
      if (attachAgain) { const a = attachAgain; attachAgain = null; attachData(a.force, { media: a.media }); }
    });
    return attachBusy;
  }
  // вкладка «Мойка и МБ» открылась впервые — тоже даём ей папку
  frame('mb').addEventListener('load', () => { if (live) setTimeout(attachData, 1500); });


  // ---------- «⚙ Настройки» (только в приложении для ПК) ----------

  // ---------- веб-дашборд: файлы и папки из «⚙ Настроек» хранит браузер (IndexedDB) ----------
  const WEBCFG = isWeb ? (() => {
    const KINDS = { akt: 'Акт приёма мойки (выращивание)', incub: 'Акт Инкубатория', zpp: 'Акт ЗПП', schedule: 'График ПР/Р', svod: 'Свод МБ (NOK, Мойка и МБ)' };
    const ROLE_TITLE = { acts: 'акты', media: 'фото/видео и презентации', svod: 'Свод МБ', nc: 'несоответствие по площадкам' };
    const idb = () => new Promise((res, rej) => {
      const r = indexedDB.open('ukpf-web-sources', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    const kvGet = async (k) => { const db = await idb(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); };
    const kvSet = async (k, v) => { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); };
    const can = async (h) => { try { return (await h.queryPermission({ mode: 'read' })) === 'granted'; } catch (e) { return false; } };
    // как «Качество мойки» разбирает акты по имени файла
    function actKind(name) {
      const n = name.toLowerCase().replace(/ё/g, 'е');
      if (/(^|[^а-яёa-z])ппр([^а-яёa-z]|$)/i.test(n)) return null;   // ППР — не наши данные
      if (/(^|[^а-я])свод(?![а-я])|журнал|микроб|(^|[^а-я])мб([^а-я]|$)|nok/.test(n)) return null;
      if (/инкуб/.test(n)) return 'incub';
      if (/зпп/.test(n)) return 'zpp';
      if (/график|пр[\s._-]*р|санразрыв/.test(n)) return 'schedule';
      if (/акт|мойк|при[её]м/.test(n)) return 'akt';
      return null;
    }
    let lastRefresh = null;
    async function newestIn(handle, test) {
      let best = null;
      for await (const h of handle.values()) {
        if (h.kind !== 'file' || h.name.startsWith('~$') || !test(h.name)) continue;
        const f = await h.getFile();
        if (!best || f.lastModified > best.mtime) best = { name: f.name, mtime: f.lastModified };
      }
      return best;
    }
    async function state() {
      const files = (await kvGet('files')) || {}, folders = (await kvGet('folders')) || [];
      let needPerm = false;
      // что найдётся само: самый свежий файл каждого вида в самих папках актов / папке Свода
      const auto = {};
      for (const f of folders) {
        if (!(await can(f.handle))) { needPerm = true; continue; }
        if (f.role === 'acts') {
          for (const k of ['akt', 'incub', 'zpp', 'schedule']) {
            const b = await newestIn(f.handle, (n) => /\.(xlsx|xlsm)$/i.test(n) && actKind(n) === k);
            if (b && (!auto[k] || b.mtime > auto[k].mtime)) auto[k] = Object.assign({ where: f.name }, b);
          }
        } else if (f.role === 'svod') {
          const b = await newestIn(f.handle, (n) => /\.xlsx$/i.test(n));
          if (b && (!auto.svod || b.mtime > auto.svod.mtime)) auto.svod = Object.assign({ where: f.name }, b);
        }
      }
      const out = {};
      for (const k of Object.keys(KINDS)) {
        const h = files[k];
        let chosen = null, missing = false;
        if (h) {
          if (await can(h)) { try { const f = await h.getFile(); chosen = { name: f.name, path: 'выбран вручную', mtime: f.lastModified }; } catch (e) { missing = true; } }
          else { needPerm = true; chosen = { name: h.name, path: 'нужно разрешить доступ — кнопка «🔓» внизу', mtime: 0 }; }
        }
        out[k] = { title: KINDS[k], chosen, chosenMissing: missing, chosenPath: h ? h.name : null, auto: h ? null : auto[k] || null };
      }
      const fl = [];
      for (const f of folders) fl.push({ name: f.name, path: (await can(f.handle)) ? 'папка «' + f.handle.name + '»' : 'нужно разрешить доступ — кнопка «🔓» внизу', role: f.role, roleTitle: ROLE_TITLE[f.role], ok: true });
      permBtn(needPerm);
      return { files: out, folders: fl, sharepoint: [], noSharePoint: true, lastRefresh, needPerm };
    }
    async function allHandles() {
      const files = (await kvGet('files')) || {}, folders = (await kvGet('folders')) || [];
      return Object.values(files).filter(Boolean).concat(folders.map((f) => f.handle));
    }
    // Chrome спрашивает разрешение на выбранные файлы один раз за запуск (или «Разрешать при каждом посещении»)
    async function requestAll() {
      let ok = true;
      for (const h of await allHandles()) {
        try { if ((await h.queryPermission({ mode: 'read' })) !== 'granted' && (await h.requestPermission({ mode: 'read' })) !== 'granted') ok = false; } catch (e) { ok = false; }
      }
      permBtn(!ok);
      return ok;
    }
    async function run(cmd, p) {
      mediaSig = null;   // папки/файлы поменялись — новая точка отсчёта для автообновления
      try {
        if (cmd === 'pick-file') {
          const [h] = await window.showOpenFilePicker({ id: 'ukpf-' + p.kind, types: [{ description: 'Excel', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx', '.xlsm'], 'text/csv': ['.csv'] } }] });
          const files = (await kvGet('files')) || {}; files[p.kind] = h; await kvSet('files', files);
          attachData(true);
        } else if (cmd === 'clear-file') {
          const files = (await kvGet('files')) || {}; delete files[p.kind]; await kvSet('files', files);
          attachData(true);
        } else if (cmd === 'add-folder') {
          const role = ['acts', 'media', 'svod', 'nc'].includes(p.role) ? p.role : 'media';
          const h = await window.showDirectoryPicker({ id: 'ukpf-' + role, mode: 'read' });
          const folders = (await kvGet('folders')) || [];
          let same = false;
          for (const f of folders) if (await f.handle.isSameEntry(h)) same = true;
          if (!same) {

            while (folders.some((f) => f.name === name)) name += ' 2';
            folders.push({ name, role, handle: h });
            await kvSet('folders', folders);
          }
          attachData(true);
        } else if (cmd === 'remove-folder') {
          await kvSet('folders', ((await kvGet('folders')) || []).filter((f) => f.name !== p.name));
          attachData(true);
        } else if (cmd === 'refresh') {
          await requestAll();
          lastRefresh = new Date().toISOString();
          await attachData(true);
        }
      } catch (e) {
        if (e.name !== 'AbortError') toast('Не получилось: ' + e.message, 'err');
      }
      return state();
    }
    const pb = document.getElementById('permBtn');
    function permBtn(need) { pb.hidden = !need; }
    pb.onclick = async () => { if (await requestAll()) { toast('Доступ разрешён — данные подтягиваются.', 'ok'); attachData(true); } };
    async function start() {
      autoLoop();
      const hs = await allHandles();
      if (!hs.length) { setTimeout(() => toast('Откройте «⚙ Настройки» внизу слева и выберите акты, Свод и папки с фото — дальше всё подтягивается само.'), 2500); return; }
      let need = false;

    }
    // ---------- автообновление ----------
    // Раз в минуту и при возврате на вкладку: акты/Свод перечитываются, если файл пересохранили;
    // папки с фото и презентациями — если в них появились/изменились файлы (новый день, новая презентация).
    let mediaSig = null, lastCheck = 0, checking = false;
    const hhmm = (d) => d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

          else if (/\.(pptx|pptm|ppsx|ppsm)$/i.test(name) && !name.startsWith('~$')) { try { const f = await h.getFile(); parts.push(pre + name + '|' + f.size + '|' + f.lastModified); } catch (e) { parts.push(pre + name); } }

        }
      }
      for (const f of folders) { try { await walk(f.handle, f.name + '/', 0); } catch (e) { parts.push(f.name + '!'); } }
      return parts.sort().join('\n');
    }
    async function autoCheck(reason) {
      if (checking || Date.now() - lastCheck < 20000) return;
      const hs = await allHandles();
      if (!hs.length) return;
      for (const h of hs) if (!(await can(h))) { permBtn(true); autoSt('⏸ автообновление ждёт «Разрешить доступ»'); return; }
      checking = true; lastCheck = Date.now();
      try {
        const sig = await folderSig();
        const mediaChanged = mediaSig !== null && sig !== mediaSig;
        mediaSig = sig;
        await attachData(false, { media: mediaChanged });
        if (mediaChanged) toast('В папках появились новые фото/презентации — данные обновлены.', 'ok');
        autoSt('🔄 авто · проверено в ' + hhmm(new Date()));
      } catch (e) { console.warn('auto', e); autoSt('🔄 авто · ошибка проверки: ' + e.message); }

  let openSettings = () => {};

  if (live || demo) {
    const $ = (id) => document.getElementById(id);
    const esc = (t) => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    const when = (ms) => (ms ? new Date(ms).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '');
    $('cfgBtn').hidden = false;
    let state = null;
    async function cfg(cmd, params) {
      if (demo) {
        if (cmd !== 'state') toast(cmd === 'refresh' ? 'В приложении: перечитает выбранные файлы и папки и докачает SharePoint.' : 'В приложении здесь откроется окно выбора файла или папки на компьютере.', 'ok');

          : f.chosenMissing ? `<span class="bad">Выбранный файл не найден: ${esc(f.chosenPath)}</span>`
          : f.auto ? `<span class="auto">Сам: <b>${esc(f.auto.name)}</b> (${esc(f.auto.where)}, ${when(f.auto.mtime)})</span>`
          : '<span class="auto">Не найден — выберите файл</span>';
        return `<div class="cfg-row"><span class="lbl">${esc(f.title)}</span><span class="val">${val}</span>

          ${f.chosen || f.chosenMissing ? `<button type="button" class="x" data-cmd="clear-file" data-kind="${k}" title="Снова искать самому">✕</button>` : ''}</div>`;
      };
      const folderRow = (m) => `<div class="cfg-row"><span class="lbl">${esc(m.roleTitle)}</span><span class="val"><b>${esc(m.name)}</b><small${m.ok ? '' : ' class="bad"'}>${esc(m.path)}${m.ok ? '' : ' — не найдена'}</small></span>
          <button type="button" class="x" data-cmd="remove-folder" data-name="${esc(m.name)}" title="Не брать из этой папки">✕</button></div>`;
      // что прочитано из презентаций: фото/видео и даты по участкам (из вкладки «Качество мойки»)
      // разбор по слайдам: «Слайд 5 · 12.10 → Г5-4 · Система поения · остатки корма · фото 2»
      const slidesRep = (r) => {
        const si = r.slideInfo || [];
        if (!si.length) return '';
        const d = (x) => (x ? x.split('-').reverse().join('.') : 'без даты');
        return `<details class="cfg-slides"><summary>Разбор по слайдам (${si.length})</summary>` + si.map((s) => s.rows.map((w) =>
          `<small${w.why ? ' class="bad"' : ''}>Слайд ${s.n} · ${d(w.date || s.date)} → <b>${esc(String(w.place || '—').replace(/^Инкубатор: /, ''))}</b>` +
          ` · точка: ${w.point ? '«' + esc(w.point) + '»' : '<i>не указана</i>'}` + (w.nc ? ' · ' + esc(w.nc) : '') +
          ` · фото/видео: ${w.n}${w.why ? ' — не взято: ' + w.why : ''}</small>`).join('')).join('') + '</details>';
      };
      const pptxReport = (which) => {
        let rep = [];
        try { const mw = frame('moika').contentWindow; rep = (which === 'nc' ? mw.MOIKA_API.nc.report() : mw.PPTX_REPORT || []).slice(); } catch (e) { /* вкладка ещё грузится */ }
        if (!rep.length) return '';
        const area = (p) => (/инкуб/i.test(p) ? 'Инкубатор' : /(^|[^а-яё])зпп([^а-яё]|$)/i.test(p) ? 'ЗПП' : 'Выращивание');
        return '<details class="cfg-rep"><summary>Прочитано из презентаций: ' + rep.length + ' файл(ов), фото/видео — ' + rep.reduce((n, r) => n + (r.n || 0), 0) + '</summary>' +
          rep.map((r) => `<div class="cfg-row"><span class="lbl">${area(r.path)}</span><span class="val"><b>${esc(r.path.split('/').pop())}</b>` +
            (r.err ? `<small class="bad">${esc(r.err)}</small>` : `<small>фото/видео: ${r.n || 0}${r.noDate ? ' · <span class="bad">без даты: ' + r.noDate + '</span>' : ''}${r.noCorpus ? ' · без корпуса: ' + r.noCorpus : ''}</small>` +
              (r.days && r.days.length ? `<small>${esc(r.days.join(' | ').replace(/Инкубатор: /g, ''))}</small>` : '') + slidesRep(r)) + '</span></div>').join('') + '</details>';
      };
      $('cfgBody').innerHTML =
        '<div class="cfg-sec">Акты</div>' + ['akt', 'incub', 'zpp', 'schedule'].map(fileRow).join('') +
        '<div class="cfg-sec">Свод микробиологии</div>' + fileRow('svod') +
        // презентации несоответствий: SharePoint (в приложении — по ссылке) и папки с ними
        '<div class="cfg-sec">Презентации несоответствий — Инкубатор, Выращивание, ЗПП</div>' +
        (state.noSharePoint
          ? '<p class="cfg-hint">По ссылке SharePoint браузер читать не может (защита браузера). Синхронизируйте папку SharePoint через OneDrive («Добавить ярлык в Мои файлы» или «Синхронизировать») и выберите её кнопкой ниже — внутри папки «Инкубатор», «Выращивание», «ЗПП». По ссылке напрямую читает приложение для ПК.</p>'
          : (state.sharepoint.length ? state.sharepoint.map((l) => `<div class="cfg-row"><span class="lbl">SharePoint: ${esc(l.name)}</span><span class="val"><small>${esc(l.link)}</small>` +
              (l.account ? `Вход: <b>${esc(l.account.email || l.account.name)}</b>` : '<span class="auto">Вход рабочей учётной записью не выполнен</span>') +
              (l.access ? (l.access.download === false ? '<small class="bad">⛔ Только просмотр — владелец папки запретил скачивание. Нужно право на скачивание или редактирование.</small>'
                : l.access.download ? '<small>✅ Скачивание разрешено' + (l.lastSync ? ' · прочитано ' + when(Date.parse(l.lastSync)) : '') + '</small>' : '<small>В папке пока нет файлов</small>') : '') +
              (l.error && !(l.access && l.access.download === false) ? `<small class="bad">${esc(l.error)}</small>` : '') +
              '</span></div>').join('') : '') +
            `<div class="cfg-add"><button type="button" data-cmd="sp-login">🔑 Войти рабочей учётной записью Microsoft</button>` +
            (state.sharepoint.some((l) => l.account) ? '<button type="button" data-cmd="sp-logout">Выйти</button>' : '') +
            `<button type="button" data-cmd="sharepoint">${state.sharepoint.length ? 'Другая ссылка SharePoint…' : '+ Ссылка SharePoint на папку с презентациями'}</button></div>`) +
        state.folders.filter((m) => m.role === 'media').map((m) => folderRow(m)).join('') +
        `<div class="cfg-add"><button type="button" data-cmd="add-folder" data-role="media">+ Папка с презентациями${state.noSharePoint ? ' (синхронизированная SharePoint)' : ''}</button></div>` +
        pptxReport() +
        // отдельная вкладка «Несоответствие по площадкам» — свои папки с презентациями
        '<div class="cfg-sec">Несоответствие по площадкам — папки с презентациями</div>' +
        '<p class="cfg-hint">Папки с презентациями (.pptx), где на слайдах прописаны несоответствие и дата (а также площадка/корпус или зал, контрольная точка). Читаются только для вкладки «📍 Несоответствие по площадкам», включая подпапки; новые и изменённые презентации подтягиваются сами.</p>' +
        state.folders.filter((m) => m.role === 'nc').map((m) => folderRow(m)).join('') +
        `<div class="cfg-add"><button type="button" data-cmd="add-folder" data-role="nc">+ Папка с презентациями несоответствий</button></div>` +
        pptxReport('nc') +
        '<div class="cfg-sec">Папки актов и Свода</div>' +
        (state.folders.filter((m) => m.role !== 'media' && m.role !== 'nc').map((m) => folderRow(m)).join('') || '<div class="cfg-row"><span class="val auto">Папок пока нет.</span></div>') +
        `<div class="cfg-add"><button type="button" data-cmd="add-folder" data-role="acts">+ Папка с актами</button>
          <button type="button" data-cmd="add-folder" data-role="svod">+ Папка со Сводом</button></div>`;
      $('cfgSt').textContent = state.lastRefresh ? 'Обновлено в ' + new Date(state.lastRefresh).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
    }
    openSettings = () => { $('cfg').hidden = false; cfg('state'); };
    $('cfgBtn').onclick = openSettings;
    $('cfgX').onclick = () => { $('cfg').hidden = true; };
    $('cfg').addEventListener('click', (e) => {
      if (e.target.id === 'cfg') { $('cfg').hidden = true; return; }
      const b = e.target.closest('button[data-cmd]'); if (!b) return;
      cfg(b.dataset.cmd, Object.assign({}, b.dataset.kind ? { kind: b.dataset.kind } : {}, b.dataset.role ? { role: b.dataset.role } : {}, b.dataset.name ? { name: b.dataset.name } : {}));
    });
    $('cfgRefresh').onclick = async () => {
      const b = $('cfgRefresh'); b.disabled = true; b.textContent = '⟳ Обновляю…';
      try { await cfg('refresh'); if (!demo) toast('Обновлено: файлы и папки перечитаны.', 'ok'); } finally { b.disabled = false; b.textContent = '⟳ Обновить сейчас'; }
    };
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('cfg').hidden) $('cfg').hidden = true; });
  }

  window.APP = { show, toast, dataChanged: attachData, active: () => current, frame, openSettings: () => openSettings() };

  let start = 'moika';
  try { start = localStorage.getItem(TAB_KEY) || 'moika'; } catch (e) {}
  if (isWeb) startFrame(frame('moika'));   // «Качество мойки» нужна всем вкладкам (фото, баллы)
  show(start);
  if (live) frame('moika').addEventListener('load', () => setTimeout(attachData, 2500), { once: true });
  if (isWeb) WEBCFG.start();
})();
</script>
</body>
</html>
