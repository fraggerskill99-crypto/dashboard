    <path d="M-38 -40 l-46 -28 M-42 0 l-58 0 M-36 40 l-46 34 M38 -40 l46 -28 M42 0 l58 0 M36 40 l46 34"/>
    <path d="M-14 -96 q-12 -26 -34 -32 M14 -96 q12 -26 34 -32"/>
