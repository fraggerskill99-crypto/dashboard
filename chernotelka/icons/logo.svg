      <stop offset="0" stop-color="#efe7d0"/><stop offset="1" stop-color="#ddd1b0"/>
    </radialGradient>
    <linearGradient id="chshell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4038"/><stop offset="1" stop-color="#1c1814"/>
