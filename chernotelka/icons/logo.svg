    <path d="M-40 -70 Q0 -84 40 -70 L44 -48 Q0 -38 -44 -48 Z" fill="#332b25"/>
    <path d="M-50 -44 Q0 -56 50 -44 Q62 40 0 104 Q-62 40 -50 -44 Z" fill="url(#chshell)"/>
    <path d="M0 -48 L0 100" stroke="#6b5f52" stroke-width="5"/>
    <path d="M-24 -30 Q-30 30 -10 74 M24 -30 Q30 30 10 74" stroke="#5a4f44" stroke-width="4" fill="none" opacity=".7"/>
    <ellipse cx="-22" cy="-20" rx="10" ry="22" fill="#fff" opacity=".12"/>
