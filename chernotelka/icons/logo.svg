  </defs>
  <rect width="512" height="512" fill="url(#chbg)"/>
  <!-- спад численности -->
  <path d="M70 150 L150 170 L215 250 L300 280 L360 360 L440 385" fill="none" stroke="#0f6b5c" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  <path d="M440 385 l-46 -6 m46 6 l-14 -44" fill="none" stroke="#0f6b5c" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  <!-- жук -->
