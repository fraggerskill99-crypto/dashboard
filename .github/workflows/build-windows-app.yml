name: Приложение «Качество мойки» для Windows

on:
  push:
    paths:
      - 'kachestvo_moyki/**'
      - '.github/workflows/build-windows-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: kachestvo_moyki/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kachestvo_moyki/app/package-lock.json

      - run: npm ci

      - name: Сборка установщика и переносной версии
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: KachestvoMoyki-Windows
          path: kachestvo_moyki/app/dist/*.exe
          if-no-files-found: error

      # последняя сборка — на странице Releases, скачивается без входа в Actions
      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-build-${{ github.run_number }}
          name: Качество мойки — сборка ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Приложение «Качество мойки — УКПФ» для Windows (64-бит).
            • KachestvoMoyki-Setup-*.exe — установщик: ярлык на рабочем столе и в меню «Пуск».
            • KachestvoMoyki-portable-*.exe — без установки, запускается сразу.
            Ветка: ${{ github.ref_name }}, коммит ${{ github.sha }}.
          files: kachestvo_moyki/app/dist/*.exe
          make_latest: true
