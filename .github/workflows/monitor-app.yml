name: Монитор птиц — сборка приложения

on:
  push:
    paths:
      - 'monitor/**'
      - '.github/workflows/monitor-app.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Веб-версия и одиночный файл
        run: python3 monitor/build_app.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android-оболочка (Capacitor)
        run: |
          mkdir -p shell && cd shell
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cp -r ../monitor/dist_app/www ./www
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "kz.ukpf.ptitsamonitor",
            "appName": "Монитор птиц",
            "webDir": "www",
            "android": { "allowMixedContent": false }
          }
          JSON
          npx cap add android
          npx cap sync android
          # иконка приложения
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp ../monitor/app/android/$dir.png $RES/mipmap-$dir/ic_launcher.png
            cp ../monitor/app/android/$dir.png $RES/mipmap-$dir/ic_launcher_round.png
          done

      - name: Сборка APK
        working-directory: shell/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/monitor-ptits.apk"

      - name: Веб-версия → ветка gh-pages
        run: |
          cd monitor/dist_app/www
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Веб-версия монитора птиц: ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - uses: actions/upload-artifact@v4
        with:
          name: android-web
          path: |
            monitor-ptits.apk
            monitor/dist_app/ptitsa_monitor.html

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Веб-версия
        run: python monitor/build_app.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Сборка .exe (Electron)
        shell: bash
        working-directory: monitor/app/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          cp -r ../../dist_app/www ./www
          npm install --no-audit --no-fund --save-dev electron@33 electron-builder@25
          npx electron-builder --win --publish never
          ls dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            monitor/app/desktop/dist/monitor-ptits-setup.exe
            monitor/app/desktop/dist/monitor-ptits-portable.exe

  release:
    needs: [build, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Выпуск «monitor-app» с файлами для установки
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          find . -type f | sort
          cp monitor/dist_app/ptitsa_monitor.html ptitsa_monitor.html
          gh release delete monitor-app --cleanup-tag -y || true
          gh release create monitor-app monitor-ptits.apk monitor-ptits-setup.exe monitor-ptits-portable.exe ptitsa_monitor.html \
            --target "$GITHUB_SHA" --title "Эпизоотический монитор птиц" \
            --notes "Телефон Android: monitor-ptits.apk — скачать, открыть, разрешить установку из этого источника. Компьютер Windows: monitor-ptits-setup.exe — установщик с ярлыком на рабочем столе; monitor-ptits-portable.exe — запуск без установки. Любой компьютер без установки: ptitsa_monitor.html — открыть двойным щелчком. Сборка ${GITHUB_SHA::7}."
